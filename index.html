<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL</title>
    <style>
        :root {
            /* Classic Phosphor Amber Palette */
            --bg-color: #080500;
            --amber-main: #ffb000;
            --amber-dim: #a67200;
            --amber-glow: rgba(255, 176, 0, 0.4);
            --font-stack: 'Courier New', Courier, Monaco, 'SF Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--amber-main);
            font-family: var(--font-stack);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Amber Tube Glow */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 176, 0, 0.05) 0%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* CRT Scanline Overlay Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
        }

        .terminal-container {
            position: relative;
            z-index: 3;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* Amber Text with Glow Effect */
        .glow-text {
            color: var(--amber-main);
            text-shadow: 
                0 0 2px var(--amber-main),
                0 0 8px var(--amber-glow);
            line-height: 1.5;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .header-block {
            margin-bottom: 24px;
            border-bottom: 1px dashed var(--amber-dim);
            padding-bottom: 12px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .sub-title {
            color: var(--amber-dim);
            font-size: 0.85rem;
        }

        .content-block {
            margin-bottom: 16px;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        .prompt-symbol {
            margin-right: 8px;
            color: var(--amber-main);
        }

        /* Animated Flashing Terminal Cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--amber-main);
            box-shadow: 0 0 8px var(--amber-glow);
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal-container glow-text">
        <div class="header-block">
            <div class="title">SYSTEM TERMINAL v1.0</div>
            <div class="sub-title">STATUS: READY // ALL SYSTEMS NOMINAL</div>
        </div>

        <div class="content-block">
            <p>> INITIALIZING DISPLAY INTERFACE...</p>
            <p>> AMBER PHOSPHOR RENDERER ONLINE.</p>
        </div>

        <div class="prompt-line">
            <span class="prompt-symbol">></span>
            <span>AWAITING INPUT...</span>
            <span class="cursor"></span>
        </div>
    </div>

</body>
</html>
