<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINZOKU LABS // TERMINAL</title>
    
    <!-- Cyberpunk Terminal Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #08080a;
            --text-main: #ffffff;
            --text-dim: #7a7d94;
            --text-glow: rgba(255, 255, 255, 0.22);
            --ok-green: #00ff66;
            --ok-glow: rgba(0, 255, 102, 0.25);
            --font-cyber: 'Share Tech Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-cyber);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient CRT Edge Vignette */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.015) 0%, rgba(0, 0, 0, 0.45) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Soft Scanline Overlay */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.18) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
        }

        .terminal-container {
            position: relative;
            z-index: 3;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
        }

        .glow-text {
            color: var(--text-main);
            text-shadow: 
                0 0 2px var(--text-main),
                0 0 5px var(--text-glow);
            line-height: 1.45;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .boot-log {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.88rem;
            padding-bottom: 40px;
        }

        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-ok {
            color: var(--ok-green);
            text-shadow: 0 0 4px var(--ok-glow);
            font-weight: bold;
        }

        .status-pad {
            display: inline-block;
            width: 72px;
        }

        .timestamp {
            color: var(--text-dim);
            margin-right: 10px;
        }

        #main-terminal {
            display: none;
        }

        .header-block {
            margin-bottom: 24px;
            border-bottom: 1px dashed var(--text-dim);
            padding-bottom: 16px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 3px;
            min-height: 1.8rem;
        }

        .sub-title {
            color: var(--text-dim);
            font-size: 0.9rem;
            letter-spacing: 1px;
            min-height: 1rem;
        }

        .content-block {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 1.2rem;
        }

        .tagline {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-style: italic;
            min-height: 1rem;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            margin-top: 24px;
            border-top: 1px dashed var(--text-dim);
            padding-top: 16px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .prompt-symbol {
            margin-right: 8px;
            color: var(--text-main);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--text-main);
            box-shadow: 0 0 6px var(--text-glow);
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="boot-container" class="terminal-container glow-text">
        <div id="boot-log" class="boot-log"></div>
    </div>

    <div id="main-terminal" class="terminal-container glow-text">
        <div class="header-block">
            <div class="title" id="type-title"></div>
            <div class="sub-title" id="type-subtitle"></div>
        </div>

        <div class="content-block">
            <p class="description" id="type-desc"></p>
            <p class="tagline" id="type-tagline"></p>
        </div>

        <div class="prompt-line" id="prompt-block">
            <span class="prompt-symbol">></span>
            <span id="type-prompt"></span>
            <span class="cursor"></span>
        </div>
    </div>

<script>
    const bootStartTime = performance.now();

    function getRealSeconds() {
        const elapsed = performance.now() - bootStartTime;
        return (elapsed / 1000).toFixed(3);
    }

    // 1. Detect device type & entry point
    const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
    const urlParams = new URLSearchParams(window.location.search);
    const isQRSource = urlParams.get('src') === 'qr' || isMobileDevice;

    // 2. Dynamic initial boot entries
    const initialEntryLog = isQRSource ? [
        { isOk: false, text: "QR URI MATRIX DECODED [TARGET: KINZOKU LABS WEB ENTRY]" },
        { isOk: false, text: "MOBILE VIEWPORT & TOUCH MATRIX DETECTED..." }
    ] : [
        { isOk: false, text: "DIRECT HTTP REQUEST RECEIVED [TARGET: KINZOKU LABS WEB ENTRY]" },
        { isOk: false, text: "DESKTOP VIEWPORT & POINTER DEVICE DETECTED..." }
    ];

    // 3. Complete browser pipeline log
    const siteBootMessages = [
        ...initialEntryLog,
        { isOk: false, text: "Initiating HTTP/3 QUIC connection handshake..." },
        { isOk: true,  text: "TLS 1.3 session established [ChaCha20-Poly1305 Cipher Suite]" },
        { isOk: true,  text: "OCSP Stapling Verified: SSL Certificate Active" },
        { isOk: false, text: "Inspecting client browser capabilities & environment..." },
        { isOk: true,  text: "Viewport parameters bound: High-DPI Matrix Active" },
        { isOk: true,  text: "Device pixel ratio & screen color gamut initialized" },
        { isOk: true,  text: "Hardware input listeners attached: Pointer, Touch & Keyboard" },
        { isOk: false, text: "Downloading primary HTML5 document stream..." },
        { isOk: true,  text: "HTTP GET / -> 200 OK [Content-Type: text/html]" },
        { isOk: false, text: "Parsing HTML token stream -> Constructing DOM tree..." },
        { isOk: true,  text: "DOM structure verified [#boot-container, #main-terminal]" },
        { isOk: false, text: "Downloading & compiling CSS stylesheet engine..." },
        { isOk: true,  text: "CSS custom variables bound (--bg-color, --text-main, --ok-green)" },
        { isOk: true,  text: "Constructing CSSOM & calculating render tree layout" },
        { isOk: true,  text: "Compositor layers initialized for smooth hardware rendering" },
        { isOk: true,  text: "Phosphor CRT scanline shader & subpixel filtering applied" },
        { isOk: false, text: "Requesting webfont resources..." },
        { isOk: true,  text: "WebFont 'Share Tech Mono' (WOFF2) loaded & bound" },
        { isOk: false, text: "Initializing JavaScript execution runtime..." },
        { isOk: false, text: "Checking SessionStorage & LocalStorage state..." },
        { isOk: true,  text: "Client session storage keys validated" },
        { isOk: false, text: "Fetching storefront content index manifest..." },
        { isOk: true,  text: "HTTP GET /api/v1/catalog/manifest.json -> 200 OK" },
        { isOk: true,  text: "Catalog manifest payload parsed [Storefront categories ready]" },
        { isOk: false, text: "Hydrating Document Object Model (DOM)..." },
        { isOk: true,  text: "DOM hydration complete [0 unhandled events]" },
        { isOk: false, text: "Executing browser garbage collection memory sweep..." },
        { isOk: true,  text: "Memory allocation nominal [0 leaks detected]" },
        { isOk: true,  text: "All browser client boot checks passed" },
        { isOk: true,  text: "Handoff to main interactive terminal interface..." }
    ];

    const logContainer = document.getElementById("boot-log");
    const bootContainer = document.getElementById("boot-container");
    const mainTerminal = document.getElementById("main-terminal");

    // TIMING CONSTANTS
    const WORD_SPEED_MS = 24;    
    const OK_LINE_DELAY = 90;    
    const INFO_LINE_DELAY = 45;  
    const FINAL_PAUSE_MS = 1800; 
    const TYPE_CHAR_SPEED = 6;   

    let msgIndex = 0;

    function printNextLine() {
        if (msgIndex < siteBootMessages.length) {
            const msg = siteBootMessages[msgIndex];
            const lineDiv = document.createElement("div");
            lineDiv.className = "log-line";

            const realTime = getRealSeconds();
            const prefixHTML = msg.isOk 
                ? `<span class="status-pad">[ <span class="status-ok">OK</span> ]</span><span class="timestamp">[ ${realTime}s ]</span>`
                : `<span class="status-pad"></span><span class="timestamp">[ ${realTime}s ]</span>`;

            lineDiv.innerHTML = prefixHTML;
            logContainer.appendChild(lineDiv);

            const words = msg.text.split(" ");
            let wordIndex = 0;

            function printWord() {
                if (wordIndex < words.length) {
                    const currentText = words.slice(0, wordIndex + 1).join(" ");
                    lineDiv.innerHTML = prefixHTML + currentText;
                    window.scrollTo(0, document.body.scrollHeight);

                    wordIndex++;
                    setTimeout(printWord, WORD_SPEED_MS);
                } else {
                    msgIndex++;
                    const lineDelay = msg.isOk ? OK_LINE_DELAY : INFO_LINE_DELAY; 
                    setTimeout(printNextLine, lineDelay);
                }
            }

            printWord();
        } else {
            setTimeout(startMainTerminal, FINAL_PAUSE_MS);
        }
    }

    function typeText(elementId, text, speed, callback) {
        const el = document.getElementById(elementId);
        let charIndex = 0;

        function step() {
            if (charIndex < text.length) {
                el.textContent += text.charAt(charIndex);
                charIndex++;
                setTimeout(step, speed);
            } else if (callback) {
                setTimeout(callback, 80);
            }
        }
        step();
    }

    function startMainTerminal() {
        bootContainer.style.display = "none";
        mainTerminal.style.display = "block";
        window.scrollTo(0, 0);

        typeText("type-title", "KINZOKU LABS", TYPE_CHAR_SPEED, () => {
            typeText("type-subtitle", "STATUS: SYSTEM ONLINE // ACCESS GRANTED", TYPE_CHAR_SPEED, () => {
                typeText("type-desc", "> SPECIALIZING IN CUSTOM CIRCUIT BOARD JEWELRY AND HARDWARE ACCESSORIES.", TYPE_CHAR_SPEED, () => {
                    typeText("type-tagline", "// PRECISION PCB FABRICATION. HARDWARE AS ART.", TYPE_CHAR_SPEED, () => {
                        document.getElementById("prompt-block").style.opacity = "1";
                        typeText("type-prompt", "AWAITING INPUT...", TYPE_CHAR_SPEED);
                    });
                });
            });
        });
    }

    window.addEventListener("load", function() {
        setTimeout(printNextLine, 250);
    });
</script>
</body>
</html>
