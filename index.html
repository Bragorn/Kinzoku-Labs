<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL</title>
    <style>
        :root {
            /* Classic Phosphor Amber Palette */
            --bg-color: #080500;
            --amber-main: #ffb000;
            --amber-dim: #a67200;
            --amber-glow: rgba(255, 176, 0, 0.4);
            --ok-green: #55ff55;
            --ok-glow: rgba(85, 255, 85, 0.4);
            --font-stack: 'Courier New', Courier, Monaco, 'SF Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--amber-main);
            font-family: var(--font-stack);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Amber Tube Glow */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 176, 0, 0.05) 0%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* CRT Scanline Overlay Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
        }

        .terminal-container {
            position: relative;
            z-index: 3;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* Amber Text with Glow Effect */
        .glow-text {
            color: var(--amber-main);
            text-shadow: 
                0 0 2px var(--amber-main),
                0 0 8px var(--amber-glow);
            line-height: 1.5;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        /* --- Boot Log Styles --- */
        .boot-log {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.9rem;
        }

        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-ok {
            color: var(--ok-green);
            text-shadow: 0 0 4px var(--ok-glow);
            font-weight: bold;
        }

        .timestamp {
            color: var(--amber-dim);
            margin-right: 8px;
        }

        /* --- Main Terminal Content Styles --- */
        #main-terminal {
            display: none; /* Hidden until boot finishes */
        }

        .header-block {
            margin-bottom: 24px;
            border-bottom: 1px dashed var(--amber-dim);
            padding-bottom: 12px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .sub-title {
            color: var(--amber-dim);
            font-size: 0.85rem;
        }

        .content-block {
            margin-bottom: 16px;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        .prompt-symbol {
            margin-right: 8px;
            color: var(--amber-main);
        }

        /* Animated Flashing Terminal Cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--amber-main);
            box-shadow: 0 0 8px var(--amber-glow);
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- SECTION 1: BOOT LOG (Runs first) -->
    <div id="boot-container" class="terminal-container glow-text">
        <div id="boot-log" class="boot-log"></div>
    </div>

    <!-- SECTION 2: MAIN TERMINAL (Revealed after boot) -->
    <div id="main-terminal" class="terminal-container glow-text">
        <div class="header-block">
            <div class="title">SYSTEM TERMINAL v1.0</div>
            <div class="sub-title">STATUS: READY // ALL SYSTEMS NOMINAL</div>
        </div>

        <div class="content-block">
            <p>> INITIALIZING DISPLAY INTERFACE...</p>
            <p>> AMBER PHOSPHOR RENDERER ONLINE.</p>
        </div>

        <div class="prompt-line">
            <span class="prompt-symbol">></span>
            <span>AWAITING INPUT...</span>
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        // Array of Boot Log Messages
        const bootMessages = [
            { time: "0.000000", text: "Linux version 6.1.0-custom-amber (gcc v12.2.0) #1 SMP PREEMPT" },
            { time: "0.004120", text: "BIOS-provided physical RAM map:" },
            { time: "0.004155", text: " BIOS-e820: [mem 0x0000000000000000-0x000000000009edff] usable" },
            { time: "0.012401", text: "Console: colour dummy device 80x25" },
            { time: "0.028910", text: "printk: console [tty0] enabled" },
            { time: "0.089304", text: "Memory: 16384K/65536K available" },
            { status: "OK", text: "Started Kernel Device Manager." },
            { status: "OK", text: "Loaded CRT Display Driver [amber_crt.ko]." },
            { status: "OK", text: "Activated Scanline Overlay Hardware Renderer." },
            { status: "OK", text: "Mounted Root File System." },
            { status: "OK", text: "Initialized Terminal Subsystem Interface." },
            { status: "OK", text: "Reached target System Initialization." },
            { status: "OK", text: "Launching Primary Interface..." }
        ];

        const logContainer = document.getElementById("boot-log");
        const bootContainer = document.getElementById("boot-container");
        const mainTerminal = document.getElementById("main-terminal");

        let index = 0;

        function printNextLine() {
            if (index < bootMessages.length) {
                const msg = bootMessages[index];
                const lineDiv = document.createElement("div");
                lineDiv.className = "log-line";

                if (msg.status) {
                    lineDiv.innerHTML = `[ <span class="status-ok">${msg.status}</span> ] ${msg.text}`;
                } else {
                    lineDiv.innerHTML = `<span class="timestamp">[${msg.time}]</span> ${msg.text}`;
                }

                logContainer.appendChild(lineDiv);
                window.scrollTo(0, document.body.scrollHeight);

                index++;

                // Fast random line delay (15ms to 60ms)
                const delay = Math.floor(Math.random() * 45) + 15;
                setTimeout(printNextLine, delay);
            } else {
                // Transition: Wait 300ms, hide boot, show main terminal
                setTimeout(() => {
                    bootContainer.style.display = "none";
                    mainTerminal.style.display = "block";
                    window.scrollTo(0, 0);
                }, 300);
            }
        }

        // Trigger boot sequence when page loads
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(printNextLine, 150);
        });
    </script>
</body>
</html>
